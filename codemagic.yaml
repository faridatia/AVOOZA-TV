workflows:
  android-build:
    name: AVOOZA TV Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Create AVOOZA TV project
        script: |
          cp lib/main.dart /tmp/main.dart

          flutter create \
            --platforms=android \
            --project-name avooza_tv \
            --org com.avooza \
            .

          cp /tmp/main.dart lib/main.dart

          rm -rf test

          flutter pub add http
          flutter pub add video_player
          flutter pub add shared_preferences

          flutter pub get

      - name: Configure Android internet
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"'
              )

          path.write_text(text)
          PY

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build AVOOZA TV APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
